name: Stable Bannerlator updates

on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stable-bannerlator-updates
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'Tyrant-4/Tyrantlator' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
    outputs:
      status: ${{ steps.merge.outputs.status }}
      tag: ${{ steps.merge.outputs.tag }}
      base: ${{ steps.merge.outputs.base }}
      upstream: ${{ steps.merge.outputs.upstream }}
      candidate: ${{ steps.merge.outputs.candidate }}
      branch: ${{ steps.publish.outputs.branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test trusted updater logic
        run: python3 -B -m unittest discover -s scripts -p test_stable_upstream.py -v
      - name: Read latest published stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/The412Banner/Bannerlator/releases/latest > "$RUNNER_TEMP/bannerlator-release.json"
      - name: Prepare merge in this disposable checkout
        id: merge
        run: |
          cp scripts/stable_upstream.py "$RUNNER_TEMP/stable_upstream.py"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 "$RUNNER_TEMP/stable_upstream.py" --disposable-checkout \
            --release-json "$RUNNER_TEMP/bannerlator-release.json" \
            --report "$RUNNER_TEMP/stable-update-report.json"
      - name: Publish candidate for the explicit PUBG build
        id: publish
        if: steps.merge.outputs.status == 'ready'
        env:
          TAG: ${{ steps.merge.outputs.tag }}
          CANDIDATE: ${{ steps.merge.outputs.candidate }}
        run: |
          branch="stable-candidates/${TAG}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git push origin "${CANDIDATE}:refs/heads/${branch}"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
      - name: Report a stopped update once per stable release
        if: steps.merge.outputs.status == 'blocked'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/stable-update-report.json', 'utf8'));
            const title = `Bannerlator ${report.tag}: automatic update needs review`;
            const {owner, repo} = context.repo;
            if (context.payload.repository?.has_issues === false) {
              core.notice(`Bannerlator ${report.tag} needs review. Issues are disabled; see the saved report artifact and run summary.`);
              return;
            }
            const issues = await github.paginate(github.rest.issues.listForRepo, {owner, repo, state: 'open', creator: 'github-actions[bot]', per_page: 100});
            if (!issues.some(issue => issue.title === title)) {
              await github.rest.issues.create({owner, repo, title, body:
                'The profiling branch was preserved. No APK was installed.\n\n' +
                '```json\n' + JSON.stringify(report, null, 2) + '\n```\n\n' +
                `Run: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}\n\n` +
                'Resolve this stable merge on profiling, retain the customizations, and build/test it before publishing. Close this issue when resolved.'});
            }
      - name: Save the merge report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stable-update-report
          path: ${{ runner.temp }}/stable-update-report.json
          if-no-files-found: warn
          retention-days: 30
      - name: Summarize preparation
        if: always()
        env:
          STATUS: ${{ steps.merge.outputs.status }}
        run: |
          printf 'Stable merge status: %s\n' "${STATUS:-error}" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: prepare
    if: needs.prepare.outputs.status == 'ready'
    permissions:
      contents: read
    uses: ./.github/workflows/_build.yml
    with:
      source_ref: ${{ needs.prepare.outputs.candidate }}
      release_number: stable-${{ needs.prepare.outputs.tag }}-${{ github.run_id }}
      pubg_only: true
      verify_network: true
    # No inherited secrets. A token-generated push does not trigger PR checks;
    # this explicit reusable build is the gate before advancing profiling.

  promote:
    needs: [prepare, build]
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Advance profiling only if its base is unchanged
        env:
          BASE: ${{ needs.prepare.outputs.base }}
          UPSTREAM: ${{ needs.prepare.outputs.upstream }}
          CANDIDATE: ${{ needs.prepare.outputs.candidate }}
          CANDIDATE_BRANCH: ${{ needs.prepare.outputs.branch }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/profiling
          test "$(git rev-parse FETCH_HEAD)" = "$BASE"
          git fetch --no-tags origin "refs/heads/${CANDIDATE_BRANCH}"
          test "$(git rev-parse FETCH_HEAD)" = "$CANDIDATE"
          test "$(git rev-parse "${CANDIDATE}^1")" = "$BASE"
          test "$(git rev-parse "${CANDIDATE}^2")" = "$UPSTREAM"
          git push origin "${CANDIDATE}:refs/heads/profiling"
          printf 'PUBG build passed. profiling advanced to `%s`. Download the APK from this run; installation and phone compatibility checks remain manual.\n' "$CANDIDATE" >> "$GITHUB_STEP_SUMMARY"
